# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# --- FIX 7: JWT Hardening ---
# Replaced weak 'secret123' with a strong, 64-byte Base64 encoded key.
# This should be loaded from an environment variable in production.

# --- FIX 7: Use a key strong enough for HS512 (>= 512 bits / 64 bytes) ---
jwt.secret=${JWT_SECRET:VGhpcyBpcyBhIHNlY3VyZSwgNjQtYnl0ZS1sb25nIEJhc2U2NCBlbmNvZGVkIHNlY3JldCBmb3IgSFM1MTIgZXhhbXBsZQ==}

# Replaced 30-day TTL with 1 hour (in milliseconds)
jwt.expiration-ms=3600000

# Added required issuer and audience claims for validation
jwt.issuer=my-secure-api
jwt.audience=my-api-users

# --- FIX 8: Error Handling ---
# Disable default error detail exposure. Our GlobalErrorHandler will handle this.
server.error.include-message=never
server.error.include-stacktrace=never

# --- FIX 5: Rate Limiting (Bucket4j) ---
bucket4j.enabled=true
bucket4j.filters[0].url=^/api/auth/login.*
bucket4j.filters[0].strategy=first
bucket4j.filters[0].http-status-code=429
bucket4j.filters[0].http-response-body={ "error": "Too many requests", "message": "You have exceeded the rate limit. Please try again later." }
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=5
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=minutes

# Logging
logging.level.root=INFO